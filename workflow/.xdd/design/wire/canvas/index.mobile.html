<!DOCTYPE html>
<!--
  workflow 画布编排器 · 移动端(降级查看态)
  移动端定位:只读查看运行状态/日志,不做编排(画布拖拽在小屏不可用)。
  桌面端才是主交互面(见 index.html)。
  @import tokens.css
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xdd workflow(移动查看)</title>
  <style>
    @import "tokens.css";
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); font-size: var(--font-base); color: var(--text-primary);
      background: var(--surface-sunken); }
    .m-toolbar { display: flex; gap: var(--space-sm); padding: var(--space-sm); background: var(--surface-elevated);
      border-bottom: 1px solid var(--border); align-items: center; }
    .m-brand { font-weight: 700; color: var(--accent); font-size: var(--font-base); }
    .m-status { margin-left: auto; font-size: var(--font-sm); padding: 2px var(--space-xs);
      background: var(--surface); border-radius: var(--radius-sm); }
    .m-section { padding: var(--space-md); }
    .m-section-title { color: var(--text-secondary); font-size: var(--font-xs); text-transform: uppercase; margin-bottom: var(--space-sm); }
    .m-node { padding: var(--space-sm); background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: var(--space-xs); font-size: var(--font-sm); }
    .m-node .badge { float: right; font-size: var(--font-xs); }
    .m-log { font-family: var(--font-mono); font-size: var(--font-xs); color: var(--text-secondary);
      background: var(--surface-sunken); padding: var(--space-sm); border-radius: var(--radius); line-height: 1.6; }
    .m-hint { padding: var(--space-md); color: var(--text-secondary); font-size: var(--font-sm);
      background: var(--warning-soft); border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="m-toolbar">
    <span class="m-brand">xdd workflow</span>
    <span class="m-status">运行中 ⏳</span>
  </div>

  <div class="m-section">
    <div class="m-section-title">节点状态(只读)</div>
    <div class="m-node">✅ brainstorm <span class="badge">通过</span></div>
    <div class="m-node">✅ spec <span class="badge">通过</span></div>
    <div class="m-node">⏳ architecture <span class="badge">运行中</span></div>
    <div class="m-node">○ plan</div>
  </div>

  <div class="m-section">
    <div class="m-section-title">实时日志</div>
    <div class="m-log">▶ [architecture] 开始<br>&nbsp;&nbsp;[architecture] stream-json ...</div>
  </div>

  <div class="m-hint">
    💡 移动端为只读查看。编辑节点/画布请在桌面端打开。
  </div>
</body>
</html>
