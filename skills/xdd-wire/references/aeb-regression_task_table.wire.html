<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  模板: 回归任务表
  状态: 主页面
  旋钮: VARIANCE=5 MOTION=3 DENSITY=7
  角色: admin
-->
<title>回归任务表 — 主页面</title>
<style>
  :root {
    --accent: #3b82f6;
    --surface: #ffffff;
    --surface-elevated: #f9fafb;
    --text-primary: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --radius: 6px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px;
    --space-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--surface-elevated); color: var(--text-primary); padding: var(--space-md); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: var(--space-sm) var(--space-md); text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--surface-elevated); font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
  tr:hover { background: var(--surface-elevated); cursor: pointer; }
  button { padding: var(--space-xs) var(--space-sm); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-pass { background: #d1fae5; color: #065f46; }
  .badge-fail { background: #fee2e2; color: #991b1b; }
  .badge-skip { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<h1>回归任务表</h1>
<table>
  <thead>
    <tr><th>任务</th><th>状态</th><th>运行时间</th><th>操作</th></tr>
  </thead>
  <tbody>
    <tr data-state="pass"><td>登录流程</td><td><span class="badge badge-pass">通过</span></td><td>3.2s</td><td><button>详情</button></td></tr>
    <tr data-state="fail"><td>支付回调</td><td><span class="badge badge-fail">失败</span></td><td>1.1s</td><td><button>详情</button> <button>重试</button></td></tr>
    <tr data-state="skip"><td>导出 Excel</td><td><span class="badge badge-skip">跳过</span></td><td>—</td><td><button>详情</button></td></tr>
  </tbody>
</table>
</body>
</html>
