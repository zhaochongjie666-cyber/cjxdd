<!DOCTYPE html>
<!--
  操作态 · empty(空状态):用户刚打开,还没填任务目录/加载图
  规范:空状态要有行动引导,别写"暂无数据"。
  从 index.html 派生:保留工具栏,画布区换成空状态引导。
  @import tokens.css
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空状态 · xdd workflow</title>
  <style>
    @import "tokens.css";
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100%; font-family: var(--font-family); color: var(--text-primary); background: var(--surface-sunken);
      display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-sm) var(--space-lg);
      background: var(--surface-elevated); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 700; color: var(--accent); }
    input[type=text] { background: var(--surface-sunken); border: 2px dashed var(--accent); color: var(--text-primary);
      padding: var(--space-xs) var(--space-sm); border-radius: var(--radius); width: 340px; }
    .state-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-sm); }
    .state-icon { font-size: 48px; }
    .state-title { font-size: var(--font-lg); font-weight: 600; }
    .state-desc { color: var(--text-secondary); font-size: var(--font-base); text-align: center; max-width: 420px; line-height: 1.6; }
    .steps { margin-top: var(--space-md); color: var(--text-secondary); font-size: var(--font-sm); line-height: 2; }
    .steps code { background: var(--surface); padding: 1px var(--space-xs); border-radius: var(--radius-sm); color: var(--accent); }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">xdd workflow 编排</div>
    <input type="text" placeholder="← 先在这里填任务目录(须含 prd.md)" autofocus>
  </header>

  <div class="state-center">
    <div class="state-icon">🗂️</div>
    <div class="state-title">还没有加载编排图</div>
    <div class="state-desc">
      填入任务目录后点「📂 加载图」,会加载该目录已保存的编排;<br>
      若没有,会给你默认的 xdd 八节点图,直接点开始就能跑。
    </div>
    <div class="steps">
      ① 填任务目录(如 <code>demo/my-project</code>)<br>
      ② 点「📂 加载图」<br>
      ③ 拖拽编辑节点 / 拉回退边(Shift+拖)<br>
      ④ 点「▶ 开始」实时跑
    </div>
  </div>
</body>
</html>
