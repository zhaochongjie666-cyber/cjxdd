page_name: "运营总览"
page_goal: "快速查看关键指标并识别最近待处理任务"
task: "overview-metrics"
domain: "dashboard-ops"

template_bundle:
  layout:
    - "layout/dashboard"
  collection:
    - "collection/table"
  overlay: []
  detail: []
  state:
    - "state/pending"
    - "state.error"

context_pack:
  views:
    - "templates/views/DashboardView.vue"
  components:
    - "templates/components/WireCard.vue"
    - "templates/components/WireTable.vue"
    - "templates/components/WireBadge.vue"
    - "templates/components/WireButton.vue"
  references:
    - "references/component-library.md#列表页语义约定"
    - "references/template-index.md#组合-c-仪表盘-最近任务表"

excluded:
  templates:
    - "collection/filter"
    - "overlay/drawer-right"
    - "overlay/dialog-centered"
    - "detail/form-section"
  reasons:
    - "当前页面主任务不是筛选和定位记录"
    - "当前页面没有右侧编辑浮层"
    - "当前页面没有阻塞式确认弹窗"
    - "当前页面不是单对象编辑页"

selection_rationale:
  primary_view_reason: "页面主任务是 overview-metrics，重点是看总览和趋势，因此选择 layout/dashboard。"
  overlay_reason: "当前页面无编辑或确认型浮层，不加载 overlay 模板，保持总览视图简洁。"
  state_reason: "仪表盘需要突出待处理任务和异常指标，因此重点覆盖 pending 与 error。"

review_focus:
  - "检查卡片区、图表区、任务表区是否职责明确，不互相抢主视觉。"
  - "检查最近任务表是否能看出待处理状态，而不是只有静态数据。"
  - "检查异常指标是否有可见错误或风险提示。"
  - "检查页面是否错误引入筛选区或编辑型浮层，破坏总览页面的节奏。"

trace:
  source_input: "references/selector-input-contract.md"
  selector_rule: "references/template-selector.md"
  generated_from: "dashboard-ops 仪表盘示例 v1"

input_snapshot:
  interactions:
    - "table"
  states:
    - "pending"
    - "error"
  primary_actions:
    - label: "查看任务"
      target: "table"
  overlay_rules: []
  table_rules:
    default_sort: "更新时间倒序"
    empty_text: "当前没有待处理任务"
    bulk_hint: ""
  filter_rules: {}

