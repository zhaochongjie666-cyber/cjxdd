<!DOCTYPE html>
<!--
  操作态 · loading(加载态):点了"开始",节点正在跑,claude 在产出
  规范:骨架屏匹配主页面结构;操作栏按钮 disabled 防误点;进度可见。
  @covers-B02-R04(SSE node_log 流式)
  @import tokens.css
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行中 · xdd workflow</title>
  <style>
    @import "tokens.css";
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100%; font-family: var(--font-family); color: var(--text-primary); background: var(--surface-sunken);
      display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-sm) var(--space-lg);
      background: var(--surface-elevated); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 700; color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-primary);
      padding: var(--space-xs) var(--space-md); border-radius: var(--radius); }
    button.danger { background: var(--danger); border-color: var(--danger); color: var(--text-on-accent); }  /* 停止按钮可用 */
    .status { margin-left: auto; padding: var(--space-xs) var(--space-sm); background: var(--warning-soft);
      border-radius: var(--radius-sm); font-size: var(--font-sm); color: var(--warning); }
    .main { flex: 1; display: flex; flex-direction: column; padding: var(--space-lg); gap: var(--space-md); }
    .node-row { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--font-sm); }
    .node-row.running { border-color: var(--warning); box-shadow: 0 0 8px var(--warning-soft); }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--warning);
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton { flex: 1; height: 12px; background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm); }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .log { font-family: var(--font-mono); font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.6;
      background: var(--surface-sunken); padding: var(--space-sm); border-radius: var(--radius); }
    @media (prefers-reduced-motion: reduce) { .spinner, .skeleton { animation: none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">xdd workflow 编排</div>
    <button disabled>📂 加载图</button>
    <button disabled>💾 保存</button>
    <button disabled>▶ 开始</button>
    <button class="danger">⏹ 停止</button>
    <div class="status">运行中 · iter-1 · 3/8</div>
  </header>

  <main class="main">
    <!-- 节点列表(骨架屏 + 当前 running) -->
    <div class="node-row">✅ brainstorm · design/intent+design.md</div>
    <div class="node-row">✅ spec · spec/_landscape+rules.md</div>
    <div class="node-row running">
      <div class="spinner"></div> architecture · 正在产出 architecture.md + flow.mermaid
      <div class="skeleton"></div>
    </div>
    <div class="node-row" style="opacity:0.5">○ wire(纯后端跳过)</div>
    <div class="node-row" style="opacity:0.5">○ resilience</div>

    <div class="log">
      ▶ [architecture] 开始<br>
      &nbsp;&nbsp;[architecture] 质量属性场景: CI 无人值守...<br>
      &nbsp;&nbsp;[architecture] 选模式: 分层架构(查 patterns.md)...<span class="spinner" style="display:inline-block;vertical-align:middle"></span>
    </div>
  </main>
</body>
</html>
