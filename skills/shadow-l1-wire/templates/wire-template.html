<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title><业务名称> - Wireframe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui; background: #e0e0e0; padding: 32px; }

    /* ── 多页面导航 ── */
    .wire-nav {
      position: sticky; top: 0; z-index: 100;
      background: #263238; padding: 10px 20px;
      display: flex; gap: 8px; align-items: center;
      border-radius: 8px 8px 0 0;
      margin-bottom: 0;
    }
    .wire-nav-title { color: #fff; font-size: 14px; font-weight: 700; margin-right: 16px; }
    .wire-tab {
      padding: 6px 14px; border-radius: 4px;
      font-size: 12px; color: #b0bec5; background: #37474f;
      cursor: pointer; text-decoration: none;
    }
    .wire-tab:hover, .wire-tab.active { background: #1976d2; color: #fff; }

    /* ── 单个页面卡片 ── */
    .wire-page {
      margin: 0 auto 32px;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    .wire-page-header {
      background: #455a64; color: #fff; padding: 8px 16px;
      font-size: 13px; display: flex; justify-content: space-between;
    }
    .wire-page-header .page-id { font-weight: 700; }
    .wire-page-header .page-coord { color: #80cbc4; font-size: 11px; }

    /* ── Viewport & Scale ──
       每个页面真实尺寸 1920×1080，等比缩放 50% 展示。
       .wire-viewport 固定 960×540（=1920×1080 × 50%），
       .wire-canvas 用 transform:scale(0.5) 缩放真实尺寸。
       内容按真实像素布局 → 缩放后看起来跟真的一样。
    */
    .wire-viewport {
      width: 960px;          /* 1920 × 50% */
      height: 540px;         /* 1080 × 50% */
      overflow: hidden;
      background: white;
      position: relative;
    }
    .wire-canvas {
      width: 1920px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      padding: 32px;
    }

    /* ── 页面内部组件 ── */
    .wireframe { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .wire-title { font-size: 18px; font-weight: 700; border-bottom: 2px solid #4caf50; padding-bottom: 10px; margin-bottom: 12px; }
    .layout { display: flex; gap: 16px; }
    .main { flex: 1; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin: 8px 0; background: white; }
    .area { border: 2px dashed #bbb; border-radius: 6px; padding: 12px; margin: 8px 0; background: #fafafa; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .badge-yellow { background: #fff8e1; color: #f57f17; }
    .badge-green { background: #e8f5e9; color: #2e7d32; }
    .input { border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; display: inline-block; min-width: 180px; }
    .btn { display: inline-block; padding: 6px 14px; border-radius: 4px; font-size: 12px; background: #1976d2; color: white; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .table th { background: #f5f5f5; }
  </style>
</head>
<body>

<!-- ━━ 多页面导航 ━━ -->
<div class="wire-nav">
  <span class="wire-nav-title"><业务名称> - Wireframe</span>
  <a class="wire-tab active" href="#page-1">P1 <页面名称></a>
  <a class="wire-tab" href="#page-2">P2 <页面名称></a>
</div>

<!-- ━━ P1: <页面名称> ━━ -->
<div class="wire-page" id="page-1">
  <div class="wire-page-header">
    <span class="page-id">P1 — <页面名称></span>
    <span class="page-coord">BXX-NYY | RXX-RXX</span>
  </div>
  <div class="wire-viewport">
    <div class="wire-canvas">
      <div class="wireframe">
        <div class="wire-title"><页面标题></div>
        <div class="layout">
          <div class="main">
            <div class="card">
              <strong><区域名称> [RXX-RXX]</strong>
              <div class="area">
                <div class="input" data-node="BXX-NYY"><输入框名称> [RXX: <校验规则>]</div>
              </div>
              <div class="area">
                <span class="btn" data-node="BXX-NYY"><按钮名称> [RXX]</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <strong>规则-UI 映射</strong>
          <table class="table">
            <tr><th>规则</th><th>页面区域</th><th>反馈</th></tr>
            <tr><td>RXX-RXX</td><td><区域名称></td><td><反馈描述></td></tr>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
