<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!--
  模板: 6 操作态的「内容区片段」集（不是独立完整页面）
  原则（见 references/operation-states.md）: 状态态 = copy 主页面骨架(index.html),
  只把 <div class="content"> 换成下面 6 个片段之一。导航/标题/操作栏保持不变。

  用法: copy index.html 成 empty.html, 把它的 .content 换成下面的「空状态」片段。
  loading/error/success/confirm/edge 同理。每态单独一个文件。
-->
<title>6 态片段参考（不直接打开，按需 copy 片段）</title>
<style>
  /* 片段用到的额外样式（主页面 tokens 已覆盖基础，这里补状态态专用）*/
  .state-center { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-secondary); }
  .state-center .state-icon { font-size: 48px; margin-bottom: var(--space-md); }
  .state-center .state-title { font-size: var(--text-lg); color: var(--text-primary); margin-bottom: var(--space-sm); }
  .state-center .state-desc { margin-bottom: var(--space-lg); }
  .skeleton { background: linear-gradient(90deg, var(--surface-elevated) 25%, var(--surface-sunken) 50%, var(--surface-elevated) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skeleton-line { height: 14px; margin-bottom: var(--space-sm); }
  .skeleton-line.short { width: 40%; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-lg); max-width: 420px; width: 90%; box-shadow: var(--shadow-lg); }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     1. 空状态 empty.html —— 把这个 .content 换进 copy 的主页面骨架
     该有: 行动引导 + CTA 入口（不是"暂无数据"）
     ════════════════════════════════════════════════════════════ -->
<div class="content">
  <div class="state-center">
    <div class="state-icon">📭</div>
    <div class="state-title">还没有 {资源名}</div>
    <div class="state-desc">{说明 + 为什么要有}。创建第一个开始吧。</div>
    <button class="primary">+ 创建{资源名}</button>
    <!-- 筛选无结果时换成: 「没有匹配的 {资源}，试试清空筛选」+ 清空按钮 -->
  </div>
</div>


<!-- ════════════════════════════════════════════════════════════
     2. 加载态 loading.html —— 骨架屏匹配主页面内容区布局
     该有: 骨架屏（和最终布局一致，不是白屏转圈）; 操作按钮 disabled
     ════════════════════════════════════════════════════════════ -->
<div class="content">
  <!-- 骨架屏要匹配主页面的表格/卡片结构（这里以表格为例）-->
  <div class="skeleton skeleton-line" style="height:32px;margin-bottom:var(--space-md)"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line short"></div>
  <div class="skeleton skeleton-line"></div>
  <!-- 主页面操作栏的按钮在 loading 态要 disabled（防用户在数据没加载时操作）-->
</div>


<!-- ════════════════════════════════════════════════════════════
     3. 错误态 error.html —— 人话 + 可操作恢复路径
     该有: 人话错误（非错误码）+ 重试; 操作栏 disabled
     ════════════════════════════════════════════════════════════ -->
<div class="content">
  <div class="state-center">
    <div class="state-icon">⚠️</div>
    <div class="state-title">{人话: 网络开了小差 / 没有权限 / 找不到这条数据}</div>
    <div class="state-desc">{原因一句 + 怎么办}。可以重试，或返回{相关页}。</div>
    <div style="display:flex;gap:var(--space-sm);justify-content:center">
      <button class="primary">重试</button>
      <button>返回首页</button>
    </div>
    <!-- 权限错误换成: 「需要 {权限} 才能访问」+ 申请权限按钮 -->
  </div>
</div>


<!-- ════════════════════════════════════════════════════════════
     4. 成功态 success.html —— 反馈 + 下一步引导
     该有: 明确成功反馈 + 下一步; 别静默成功
     ════════════════════════════════════════════════════════════ -->
<div class="content">
  <div class="state-center">
    <div class="state-icon">✅</div>
    <div class="state-title">{资源名}创建成功</div>
    <div class="state-desc">{影响: 将通知相关人 / 已保存为草稿}。</div>
    <div style="display:flex;gap:var(--space-sm);justify-content:center">
      <button class="primary">查看{资源名}</button>
      <button>继续创建</button>
    </div>
    <!-- 小操作可用 toast（非整页）: 主页面不变, 局部弹「已保存」3 秒后消失 -->
  </div>
</div>


<!-- ════════════════════════════════════════════════════════════
     5. 确认态 confirm.html —— 模态框覆盖在主页面上（不整页替换）
     该有: 后果说明 + 范围; 取消是默认（确认用警示色）
     ════════════════════════════════════════════════════════════ -->
<!-- 这个态特殊: copy 整个主页面(index.html)做底, 在 </body> 前加这个 modal overlay -->
<div class="modal-overlay">
  <div class="modal">
    <div class="state-title" style="color:var(--danger-text)">确认删除{资源名}？</div>
    <div class="state-desc" style="margin:var(--space-md) 0">
      删除后<strong>{资源名}及其 {N 条} 关联数据将无法恢复</strong>。
      <!-- 影响范围: "将删除 3 个子任务" -->
    </div>
    <!-- 高危可加输入确认: 「输入 {资源名} 名称确认删除」+ input -->
    <div style="display:flex;gap:var(--space-sm);justify-content:flex-end;margin-top:var(--space-lg)">
      <button class="primary">取消</button>  <!-- 取消是默认/主按钮, 防误点 -->
      <button style="background:var(--danger);color:white;border-color:var(--danger)">确认删除</button>
    </div>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════════
     6. 边界态 edge.html —— 多是就地局部组件, 不整页。按类型选:
     ════════════════════════════════════════════════════════════ -->

<!-- 输入超限（就地, 在输入框旁）-->
<div class="content">
  <label>备注 <span style="color:var(--text-secondary)">(最多 200 字)</span></label>
  <textarea style="width:100%;border:1px solid var(--danger);border-radius:var(--radius);padding:var(--space-sm)" rows="3"></textarea>
  <div style="color:var(--danger-text);font-size:var(--text-xs);margin-top:var(--space-xs)">
    已超出 12 字，提交按钮已禁用。请精简内容。
  </div>
  <button disabled style="margin-top:var(--space-sm)">提交</button>
</div>

<!-- 配额耗尽（就地, 替换主操作区）-->
<div class="content">
  <div class="state-center">
    <div class="state-icon">📊</div>
    <div class="state-title">本月配额已用完</div>
    <div class="state-desc">已用 1000/1000 次。{日期} 重置，或升级配额。</div>
    <button class="primary">升级配额</button>
  </div>
</div>

<!-- 无权限（就地遮罩或替换内容区）-->
<div class="content">
  <div class="state-center">
    <div class="state-icon">🔒</div>
    <div class="state-title">需要 {角色/权限} 权限</div>
    <div class="state-desc">当前角色无法访问此页面。可向管理员申请权限。</div>
    <button class="primary">申请权限</button>
  </div>
</div>

</body>
</html>
