page_name: "数据列表"
page_goal: "快速定位待处理数据并完成编辑"
task: "browse-list"
domain: "data-management"

template_bundle:
  layout:
    - "layout/data-list"
  collection:
    - "collection/filter"
    - "collection/table"
    - "collection/pagination"
    - "collection/bulk-actions"
  overlay:
    - "overlay/drawer-right"
  detail: []
  state:
    - "state/loading"
    - "state/empty"
    - "state/error"
    - "state/success"

context_pack:
  views:
    - "templates/views/DataListView.vue"
  components:
    - "templates/components/WireFilter.vue"
    - "templates/components/WireTable.vue"
    - "templates/components/WirePagination.vue"
    - "templates/components/WireDrawer.vue"
    - "templates/components/WireButton.vue"
    - "templates/components/WireBadge.vue"
  references:
    - "references/component-library.md#浮层语义约定"
    - "references/component-library.md#列表页语义约定"
    - "references/template-index.md#组合-a-数据管理列表-编辑抽屉"

excluded:
  templates:
    - "layout/dashboard"
    - "overlay/dialog-centered"
    - "detail/tabs"
    - "detail/desc-list"
  reasons:
    - "当前页面主任务不是指标总览"
    - "当前编辑交互需要保留底层上下文，不适合阻塞式 dialog"
    - "当前页面不是多标签详情页"
    - "当前页面主任务不是只读详情展示"

selection_rationale:
  primary_view_reason: "页面主任务是 browse-list，核心行为是筛选、浏览、定位和处理多条记录，因此选择 layout/data-list。"
  overlay_reason: "编辑动作从表格行发起，且关闭后需要保留筛选条件、分页和列表上下文，因此选择 overlay/drawer-right。"
  state_reason: "列表页必须覆盖 loading / empty / error，同时保存成功后需要有 success 反馈。"

review_focus:
  - "检查筛选区是否表达“快速定位待处理数据”的主任务，而不是只罗列字段。"
  - "检查表格是否交代默认排序、空态文案和批量动作。"
  - "检查“编辑”动作是否明确打开右侧抽屉，而不是让审查者自己猜。"
  - "检查抽屉是否写清 trigger / close / after_close。"
  - "检查成功、错误、待处理状态是否至少有一种用户可见反馈。"

trace:
  source_input: "references/selector-input-contract.md"
  selector_rule: "references/template-selector.md"
  generated_from: "data-management 列表页示例 v1"

input_snapshot:
  interactions:
    - "filter"
    - "table"
    - "pagination"
    - "bulk-actions"
    - "drawer-right"
  states:
    - "loading"
    - "empty"
    - "error"
    - "success"
  primary_actions:
    - label: "新增数据"
      target: "drawer-right"
    - label: "编辑"
      target: "drawer-right"
    - label: "批量删除"
      target: "table"
  overlay_rules:
    - type: "drawer-right"
      trigger: "点击表格行“编辑”"
      close: "右上角关闭 / 遮罩关闭"
      after_close: "回到列表页并保留当前筛选与分页"
  table_rules:
    default_sort: "创建时间倒序"
    empty_text: "当前筛选条件下暂无数据"
    bulk_hint: "支持批量导入、导出、删除"
  filter_rules:
    primary_goal: "快速定位待处理数据并缩小结果集"
    search_hint: "优先按名称、状态、时间范围组合筛选"
