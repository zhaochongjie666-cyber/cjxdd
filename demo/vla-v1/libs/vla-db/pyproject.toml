[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.27",
    "psycopg2-binary>=2.9.9",
    "vla-common",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vla_db*"]
