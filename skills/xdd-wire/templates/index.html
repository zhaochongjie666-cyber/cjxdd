<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  模板: 主页面骨架（copy 这个改）
  状态: 主页面 desktop
  旋钮: VARIANCE=7 MOTION=6 DENSITY=4
  角色: {默认用户}

  改这个文件做你的页面：
  1. 改 <title> + h1 为你的页面名
  2. nav 改你的导航项
  3. .action-bar 改你的操作按钮
  4. .content 换成你的内容（表格/表单/卡片）
  5. 6 个状态态 copy 主页面骨架，只换 .content（见 operation-states.md）
-->
<title>{页面名} — 主页面</title>
<style>
  @import url('./tokens.css');  /* 或直接把 tokens.css 的 :root 复制进来 */
  :root { /* 旋钮值（覆盖 tokens 默认）*/ }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: var(--text-base);
    background: var(--surface-elevated);
    color: var(--text-primary);
    line-height: 1.5;
  }

  /* 全局导航 */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: var(--space-sm) var(--space-lg);
    display: flex; gap: var(--space-md); align-items: center;
  }
  .nav-brand { font-weight: 600; font-size: var(--text-md); margin-right: var(--space-lg); }
  .nav a { color: var(--text-secondary); text-decoration: none; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius); }
  .nav a.active { color: var(--accent); background: var(--accent-soft); }
  .nav a:hover { background: var(--surface-elevated); }

  /* 页面主区 */
  .page { padding: var(--space-lg); max-width: 1200px; margin: 0 auto; }

  /* 标题 + 操作栏 */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); }
  .page-header h1 { font-size: var(--text-xl); }
  .page-header .subtitle { color: var(--text-secondary); font-size: var(--text-sm); margin-top: var(--space-xs); }
  .action-bar { display: flex; gap: var(--space-sm); }

  /* 按钮（token 驱动）*/
  button, .btn {
    padding: var(--space-xs) var(--space-md);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    font-size: var(--text-base);
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover, .btn:hover { background: var(--surface-elevated); }
  button.primary, .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover, .btn.primary:hover { background: var(--accent-hover); }
  button:disabled { color: var(--text-disabled); cursor: not-allowed; opacity: 0.6; }

  /* 内容区（状态态只换这里）*/
  .content {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: var(--space-lg);
    box-shadow: var(--shadow-sm);
  }

  /* 表格（常见内容，按需保留/删）*/
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: var(--space-sm) var(--space-md); font-size: var(--text-xs); color: var(--text-secondary); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface-elevated); cursor: pointer; }

  /* 状态标签 badge */
  .badge { padding: 2px var(--space-sm); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
  .badge-success { background: var(--success-soft); color: var(--success-text); }
  .badge-warning { background: var(--warning-soft); color: var(--warning-text); }
  .badge-danger { background: var(--danger-soft); color: var(--danger-text); }

  /* 移动端：单列 + 操作栏置底 */
  @media (max-width: 640px) {
    .nav { overflow-x: auto; }
    .page-header { flex-direction: column; align-items: stretch; gap: var(--space-sm); }
    .action-bar { flex-wrap: wrap; }
    .content { padding: var(--space-md); overflow-x: auto; }
  }
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">{项目名}</span>
  <a href="#" class="active">{当前页}</a>
  <a href="#">{其他页}</a>
  <a href="#">{其他页}</a>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>{页面名}</h1>
      <div class="subtitle">{一句话说明这个页面干嘛}</div>
    </div>
    <div class="action-bar">
      <button class="primary">{主操作}</button>
      <button>{次操作}</button>
    </div>
  </div>

  <!-- 内容区：状态态（empty/loading/error/...）只换这一块 -->
  <div class="content">
    <!-- @covers-RXX 交互回指规则（HTML 注释）-->
    <table>
      <thead>
        <tr><th>{列1}</th><th>{列2}</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr><td>{数据}</td><td>{数据}</td><td><span class="badge badge-success">正常</span></td><td><button>详情</button></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
