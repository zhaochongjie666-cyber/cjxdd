<!DOCTYPE html>
<!--
  workflow 画布编排器 · 主页面(desktop)
  规格来源: @covers-B02-R01(节点模型) @covers-B02-R02(边) @covers-B02-R04(SSE)
  设计旋钮: DESIGN_VARIANCE=5(对称工具感) MOTION_INTENSITY=4(克制) VISUAL_DENSITY=7(紧凑工具)
  @import tokens.css —— 改主题只改那一份
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xdd workflow 画布编排器</title>
  <style>
    @import "tokens.css";
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-family); font-size: var(--font-base);
      color: var(--text-primary); background: var(--surface-sunken); display: flex; flex-direction: column; }

    /* 工具栏 */
    .toolbar { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-sm) var(--space-lg);
      background: var(--surface-elevated); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: var(--font-md); color: var(--accent); }
    .toolbar label { color: var(--text-secondary); font-size: var(--font-sm); }
    input[type=text] { background: var(--surface-sunken); border: 1px solid var(--border); color: var(--text-primary);
      padding: var(--space-xs) var(--space-sm); border-radius: var(--radius); font-size: var(--font-base); width: 340px; }
    button { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border-strong);
      padding: var(--space-xs) var(--space-md); border-radius: var(--radius); cursor: pointer; font-size: var(--font-base); }
    button:hover { background: var(--border); }
    button.primary { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--text-on-accent); }
    button.danger { background: var(--danger); border-color: var(--danger); color: var(--text-on-accent); }
    .status { margin-left: auto; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm);
      background: var(--surface); font-size: var(--font-sm); }

    /* 主区 */
    .main { flex: 1; display: flex; overflow: hidden; }
    .palette { width: 200px; flex-shrink: 0; background: var(--surface-elevated);
      border-right: 1px solid var(--border); padding: var(--space-md); overflow-y: auto; }
    .palette-title { color: var(--text-secondary); font-size: var(--font-xs); text-transform: uppercase;
      margin: var(--space-sm) 0 var(--space-xs); letter-spacing: 0.5px; }
    .drag-item { padding: var(--space-sm); background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: var(--space-xs); cursor: grab; font-size: var(--font-sm); }
    .drag-item:hover { border-color: var(--accent); }
    .drag-item small { display: block; color: var(--text-disabled); font-size: var(--font-xs); margin-top: 2px; }
    #canvas { flex: 1; background: var(--surface-sunken); }

    /* 日志面板 */
    .logpanel { height: 200px; flex-shrink: 0; background: var(--surface-sunken);
      border-top: 1px solid var(--border); display: flex; flex-direction: column; }
    .loghead { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-xs) var(--space-md);
      background: var(--surface-elevated); border-bottom: 1px solid var(--border); font-size: var(--font-sm); color: var(--text-secondary); }
    #log { flex: 1; padding: var(--space-xs) var(--space-md); overflow-y: auto;
      font-family: var(--font-mono); font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
  </style>
</head>
<body>
  <!-- 工具栏 -->
  <header class="toolbar">
    <div class="brand">xdd workflow 编排</div>
    <label>任务目录</label>
    <input type="text" placeholder="/abs/demo/my-project (须含 prd.md)">
    <button>📂 加载图</button>
    <button>💾 保存</button>
    <button>♻️ 重置默认</button>
    <button class="primary">▶ 开始</button>
    <button class="danger">⏹ 停止</button>
    <div class="status">就绪</div>
  </header>

  <main class="main">
    <!-- 左面板:拖拽添加 -->
    <aside class="palette">
      <div class="palette-title">拖拽添加节点</div>
      <div class="drag-item">🔹 xdd 标准节点<small>use skill</small></div>
      <div class="drag-item">🔸 自定义节点<small>任意命令</small></div>
      <div class="drag-item">🚦 验收闸节点<small>gate=true</small></div>
      <div class="palette-title">连线</div>
      <div style="font-size:var(--font-sm);color:var(--text-secondary)">拖圆点=next<br>Shift+拖=loop(回退)</div>
    </aside>

    <!-- 画布(占位,真实 Drawflow 在 A7)== -->
    <section id="canvas">
      <!-- 节点示例(展示形态,非真实交互) -->
      <div style="position:absolute;left:80px;top:80px;width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-sm)">
        <div style="font-weight:600">✅ brainstorm <span style="font-size:var(--font-xs);background:var(--warning-soft);padding:1px 5px;border-radius:var(--radius-sm);float:right">gate</span></div>
        <div style="font-size:var(--font-sm);color:var(--text-secondary);font-family:var(--font-mono);margin-top:2px">use skill: xdd-brainstorm</div>
        <div style="font-size:var(--font-xs);color:var(--text-disabled);margin-top:2px">YACC · .../design.md</div>
      </div>
      <div style="position:absolute;left:80px;top:260px;color:var(--text-disabled);font-size:var(--font-sm)">↓ next 边 / ↩ loop 边(虚线)</div>
    </section>
  </main>

  <!-- 日志面板 -->
  <footer class="logpanel">
    <div class="loghead">
      <span>实时日志</span>
      <label style="font-size:var(--font-sm)"><input type="checkbox" checked> 自动滚动</label>
    </div>
    <div id="log">
      <div>▶ [n0_brainstorm] 开始</div>
      <div>  [n0_brainstorm] claude stream-json ...</div>
      <div>✅ [n0_brainstorm] 通过</div>
    </div>
  </footer>
</body>
</html>
